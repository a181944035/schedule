<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#c5a059" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<title>东叔日程 · 每日每周规划</title>
<style>
  :root{
    --bg:#fbf7ef; --card:#ffffff; --card2:#f6f0e4; --text:#2b2620; --muted:#8a8073;
    --line:#ece3d4; --gold:#c5a059; --gold-d:#a9863f; --shadow:0 6px 22px rgba(120,95,40,.10);
    --blue:#3b82f6; --green:#22a06b; --purple:#8b5cf6; --orange:#f08c3a; --red:#e2554f; --gray:#9aa0a6;
    --ok:#22a06b;
  }
  @media (prefers-color-scheme: dark){ :root{} }
  body.dark{
    --bg:#16140f; --card:#221f18; --card2:#2c291f; --text:#f1ead9; --muted:#a99e89;
    --line:#3a352a; --shadow:0 6px 22px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
      "PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 90px}
  header{
    position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),var(--bg) 70%,transparent);
    padding:14px 0 10px;backdrop-filter:blur(6px)
  }
  .top{display:flex;align-items:center;gap:10px}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--gold);display:grid;place-items:center;
    color:#fff;font-weight:800;font-size:18px;box-shadow:var(--shadow);flex:none}
  .title{flex:1;min-width:0}
  .title h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.5px}
  .title .date{font-size:12px;color:var(--muted);margin-top:1px}
  .icon-btn{width:38px;height:38px;border:none;border-radius:11px;background:var(--card);color:var(--text);
    display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow);cursor:pointer;flex:none}
  .icon-btn:active{transform:scale(.94)}
  .tabs{display:flex;gap:8px;margin-top:12px;background:var(--card2);padding:4px;border-radius:13px}
  .tab{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;
    padding:9px 0;border-radius:10px;cursor:pointer}
  .tab.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

  .stat{display:flex;gap:10px;margin:14px 0}
  .stat .box{flex:1;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:12px}
  .ring{width:46px;height:46px;flex:none}
  .stat .n{font-size:20px;font-weight:800}
  .stat .l{font-size:12px;color:var(--muted)}

  .weekbar{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:2px}
  .day{flex:1;min-width:54px;background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;
    box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent}
  .day.on{border-color:var(--gold);background:var(--card2)}
  .day .wd{font-size:11px;color:var(--muted)}
  .day .dm{font-size:16px;font-weight:800;margin-top:2px}
  .day.today .dm{color:var(--gold-d)}

  .tools{display:flex;gap:8px;margin:12px 0 4px}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;
    padding:9px 12px;box-shadow:var(--shadow)}
  .search input{flex:1;border:none;background:transparent;color:var(--text);font-size:14px;outline:none}
  .chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 2px;padding-bottom:2px}
  .chip{border:none;background:var(--card);color:var(--muted);font-size:12px;font-weight:700;
    padding:6px 12px;border-radius:20px;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}
  .chip.on{background:var(--gold);color:#fff}

  .list{margin-top:8px;display:flex;flex-direction:column;gap:10px}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
  .task{display:flex;gap:11px;background:var(--card);border-radius:14px;padding:13px 14px;
    box-shadow:var(--shadow);align-items:flex-start;position:relative}
  .task .ck{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--muted);flex:none;margin-top:1px;
    cursor:pointer;display:grid;place-items:center;color:#fff;font-size:14px;transition:.15s}
  .task.done .ck{background:var(--ok);border-color:var(--ok)}
  .task.done .tt{text-decoration:line-through;color:var(--muted)}
  .task .body{flex:1;min-width:0}
  .task .tt{font-weight:700;font-size:15px;word-break:break-word}
  .task .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
  .tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;color:#fff}
  .tg-work{background:var(--blue)} .tg-life{background:var(--green)}
  .tg-health{background:var(--orange)} .tg-important{background:var(--red)} .tg-other{background:var(--gray)}
  .pill{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
  .pri{width:9px;height:9px;border-radius:50%;display:inline-block}
  .pri-high{background:var(--red)} .pri-mid{background:var(--orange)} .pri-low{background:var(--gray)}
  .task .act{display:flex;flex-direction:column;gap:6px}
  .task .act button{border:none;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 4px}
  .task.due .tt::after{content:"⏰";font-size:12px;margin-left:6px}
  .task.late{box-shadow:var(--shadow),inset 0 0 0 2px var(--red)}

  .addbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
    width:min(732px,calc(100% - 28px));display:flex;gap:10px;z-index:30}
  .addbar input{flex:1;border:none;border-radius:14px;padding:15px 16px;font-size:15px;box-shadow:var(--shadow);
    background:var(--card);color:var(--text);outline:none}
  .addbar .plus{width:52px;height:52px;border-radius:16px;border:none;background:var(--gold);color:#fff;
    font-size:26px;box-shadow:var(--shadow);cursor:pointer;flex:none}
  .addbar .plus:active{transform:scale(.94)}

  .modal{position:fixed;inset:0;z-index:50;background:rgba(20,16,8,.45);display:none;align-items:flex-end;
    justify-content:center;padding:0}
  .modal.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:760px;border-radius:20px 20px 0 0;padding:18px 16px
    calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
  .sheet h3{margin:0 0 14px;font-size:17px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);
    color:var(--text);border-radius:11px;padding:11px 12px;font-size:15px;outline:none;font-family:inherit}
  .field textarea{resize:vertical;min-height:64px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .catpick{display:flex;flex-wrap:wrap;gap:8px}
  .catpick button{border:2px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 13px;
    font-size:13px;font-weight:700;color:var(--text);cursor:pointer}
  .catpick button.on{border-color:var(--gold);background:var(--card2)}
  .pripick{display:flex;gap:8px}
  .pripick button{flex:1;border:2px solid var(--line);background:var(--bg);border-radius:11px;padding:9px;
    font-weight:700;font-size:13px;color:var(--text);cursor:pointer}
  .pripick button.on{border-color:var(--gold);background:var(--card2)}
  .btns{display:flex;gap:10px;margin-top:8px}
  .btns button{flex:1;border:none;border-radius:13px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
  .btn-save{background:var(--gold);color:#fff}
  .btn-del{background:var(--card2);color:var(--red);flex:none;width:auto;padding:14px 18px}
  .btn-cancel{background:var(--card2);color:var(--text)}

  .settings .field small{color:var(--muted);font-weight:400;font-size:11px;display:block;margin-top:4px}
  .sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:2px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--gray)}
  .dot.ok{background:var(--ok)} .dot.off{background:var(--orange)} .dot.err{background:var(--red)}
  .qr{width:160px;height:160px;background:#fff;border-radius:12px;margin:8px auto;display:block}
  .toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:80;background:var(--text);
    color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);
    opacity:0;transition:.25s;max-width:90%;text-align:center;pointer-events:none}
  .toast.show{opacity:1}
  .banner{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#fff;border-radius:14px;
    padding:12px 14px;margin:12px 0;box-shadow:var(--shadow);font-size:13px;display:flex;gap:10px;align-items:center}
  .banner b{font-size:15px}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6}
  .ol-status{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
  .switch-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-top:8px;cursor:pointer}
  .switch-row input{width:18px;height:18px;accent-color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="logo">东</div>
      <div class="title">
        <h1>东叔日程</h1>
        <div class="date" id="todayLabel"></div>
      </div>
      <button class="icon-btn" id="themeBtn" title="切换深色">🌓</button>
      <button class="icon-btn" id="syncBtn" title="同步状态">☁️</button>
      <button class="icon-btn" id="setBtn" title="设置">⚙️</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-view="today">📅 今日</button>
      <button class="tab" data-view="week">🗓️ 本周</button>
    </div>
    <div class="sync" id="syncRow"><span class="dot" id="syncDot"></span><span id="syncText">本地模式</span></div>
  </header>

  <div id="bannerBox"></div>

  <div class="stat" id="statBox"></div>

  <div id="weekWrap" style="display:none">
    <div class="weekbar" id="weekBar"></div>
  </div>

  <div class="tools">
    <div class="search">🔍<input id="search" placeholder="搜索任务…" /></div>
  </div>
  <div class="chips" id="chips"></div>

  <div class="list" id="list"></div>
</div>

<div class="addbar">
  <input id="quickAdd" placeholder="快速添加（回车确认）…" />
  <button class="plus" id="plusBtn">＋</button>
</div>

<!-- 编辑/新增 弹窗 -->
<div class="modal" id="editModal">
  <div class="sheet">
    <h3 id="editTitle">新增任务</h3>
    <div class="field">
      <label>事项</label>
      <input id="f_title" placeholder="要做什么？" />
    </div>
    <div class="row">
      <div class="field"><label>日期</label><input id="f_date" type="date" /></div>
      <div class="field"><label>时间（用于提醒）</label><input id="f_time" type="time" /></div>
    </div>
    <div class="field">
      <label>分类</label>
      <div class="catpick" id="f_cat"></div>
    </div>
    <div class="field">
      <label>优先级</label>
      <div class="pripick" id="f_pri">
        <button data-p="high">🔴 高</button>
        <button data-p="mid" class="on">🟠 中</button>
        <button data-p="low">⚪ 低</button>
      </div>
    </div>
    <div class="field">
      <label>重复</label>
      <select id="f_repeat">
        <option value="none">不重复</option>
        <option value="daily">每天</option>
        <option value="weekdays">每工作日（周一~周五）</option>
        <option value="weekly">每周（按日期）</option>
      </select>
    </div>
    <div class="field">
      <label>备注</label>
      <textarea id="f_note" placeholder="补充说明（可选）"></textarea>
    </div>
    <div class="btns">
      <button class="btn-del" id="editDel" style="display:none">删除</button>
      <button class="btn-cancel" id="editCancel">取消</button>
      <button class="btn-save" id="editSave">保存</button>
    </div>
  </div>
</div>

<!-- 设置 弹窗 -->
<div class="modal settings" id="setModal">
  <div class="sheet">
    <h3>设置 · 多端同步</h3>
    <div class="field">
      <label>同步模式</label>
      <select id="s_mode">
        <option value="local">本地保存（各设备独立）</option>
        <option value="jsonbin">无服务器云同步（JSONBin，推荐）</option>
        <option value="cloud">Firebase 实时同步（需建项目）</option>
      </select>
    </div>
    <div id="jsonbinFields" style="display:none">
      <div class="field">
        <label>JSONBin API Key（X-Master-Key）</label>
        <input id="s_jbkey" placeholder="注册 jsonbin.io 获取" />
        <small>免费、无需你自己的服务器。所有设备填同一个 Key + Bin ID 即可同步。</small>
      </div>
      <div class="field">
        <label>Bin ID（留空自动创建）</label>
        <input id="s_jbid" placeholder="自动创建" />
      </div>
    </div>
    <div id="cloudFields">
      <div class="field">
        <label>Firebase API Key</label>
        <input id="s_apikey" placeholder="AIzaSy…" />
      </div>
      <div class="field">
        <label>Auth Domain</label>
        <input id="s_auth" placeholder="xxx.firebaseapp.com" />
      </div>
      <div class="field">
        <label>Project ID</label>
        <input id="s_pid" placeholder="xxx" />
      </div>
      <div class="field">
        <label>App ID</label>
        <input id="s_appid" placeholder="1:123:web:abc" />
      </div>
      <div class="field">
        <label>同步码（所有设备填同一个即可共享数据）</label>
        <input id="s_code" placeholder="留空自动生成" />
        <small>同步码就是你的"账号"，记住它。换设备输入同一码即可同步。</small>
        <canvas id="qr" class="qr" style="display:none"></canvas>
      </div>
      <div class="field">
        <label>提前提醒（分钟）</label>
        <select id="s_lead">
          <option value="5">5 分钟</option>
          <option value="10" selected>10 分钟</option>
          <option value="15">15 分钟</option>
          <option value="30">30 分钟</option>
        </select>
      </div>
    </div>
    <div class="field" id="localFields">
      <label>本机数据 / 日历</label>
      <div class="btns">
        <button class="btn-cancel" id="btnExport">⬇️ 备份</button>
        <button class="btn-cancel" id="btnImport">⬆️ 导入</button>
      </div>
      <input id="fileInput" type="file" accept="application/json" style="display:none" />
    </div>
    <div class="field" id="caldavFields">
      <label>📅 同步到 iCloud 日历（全设备可见，iCloud 中转）</label>
      <small>任务自动写入你的 iCloud 日历：iPhone/iPad/Mac/Win 原生同步，OPPO 用 DAVx⁵ 连 iCloud CalDAV。浏览器直连 iCloud 会被跨域拦截，需部署一个免费代理（见 caldav-proxy/README.md）。<b>不填也不影响各设备系统日历互相同步。</b></small>
      <div class="field" style="margin-top:6px">
        <label>iCloud 代理地址（Vercel Edge，注意含 /api/caldav-proxy）</label>
        <input id="s_cvproxy" placeholder="https://xxx.vercel.app/api/caldav-proxy" />
      </div>
      <div class="field">
        <label>Apple ID（邮箱）</label>
        <input id="s_cvuser" placeholder="you@icloud.com" />
      </div>
      <div class="field">
        <label>App 专用密码</label>
        <input id="s_cvpass" type="password" placeholder="苹果账号→安全→App 专用密码" />
      </div>
      <label class="switch-row"><span>新建/修改任务自动写入日历</span><input type="checkbox" id="s_cvauto" /></label>
      <div class="btns" style="margin-top:8px">
        <button class="btn-save" id="btnCVTest" style="flex:1">测试连接</button>
      </div>
      <div id="cvStatus" class="ol-status">未配置</div>
    </div>
    <div class="btns">
      <button class="btn-cancel" id="setCancel">取消</button>
      <button class="btn-save" id="setSave">保存</button>
    </div>
    <div class="hint">部署与 Firebase 配置详见 README.md。所有配置仅存于本机浏览器。</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
/* ============ 常量与工具 ============ */
const CATS = [
  {k:"work",name:"工作",cls:"tg-work"},
  {k:"life",name:"生活",cls:"tg-life"},
  {k:"health",name:"健康",cls:"tg-health"},
  {k:"important",name:"重要",cls:"tg-important"},
  {k:"other",name:"其他",cls:"tg-other"},
];
const catMap = Object.fromEntries(CATS.map(c=>[c.k,c]));
const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const uid = ()=> Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const todayStr = (d=new Date())=>{ d=new Date(d); const z=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
const WEEK = ["日","一","二","三","四","五","六"];
function weekDays(){ // 本周一 ~ 周日
  const now=new Date(); const day=(now.getDay()+6)%7; const mon=new Date(now); mon.setDate(now.getDate()-day);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}

/* ============ 状态 ============ */
const LS={cfg:"ds_cfg",tasks:"ds_tasks",done:"ds_done",theme:"ds_theme",lead:"ds_lead",cv:"ds_cv"};
let state={ tasks:[], view:"today", selDay:todayStr(), search:"", filterCat:"all",
  theme:localStorage.getItem(LS.theme)||"auto", lead:+(localStorage.getItem(LS.lead)||10), cv:{autoSync:true} };
let fb=null; // {db,ref,setDoc,unsub}
let jb=null, jbTimer=null; // jsonbin {key,id}
let reminded={}; // { "date#id": true }

/* ============ 数据层 ============ */
function loadLocal(){ try{ return JSON.parse(localStorage.getItem(LS.tasks)||"[]"); }catch{ return []; } }
function saveLocal(){ localStorage.setItem(LS.tasks, JSON.stringify(state.tasks)); }

async function enableCloud(cfg, code){
  const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const {getFirestore,doc,onSnapshot,setDoc,enableIndexedDbPersistence}=
    await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app=initializeApp(cfg); const db=getFirestore(app);
  try{ await enableIndexedDbPersistence(db); }catch(e){}
  const ref=doc(db,"boards",code);
  const unsub=onSnapshot(ref,snap=>{
    if(snap.exists()){ const d=snap.data(); state.tasks=d.tasks||[]; setSync("ok","已同步 · "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})); }
    else { saveCloud(); }
    render();
  }, err=>{ setSync("err","同步失败，检查配置"); });
  fb={db,ref,setDoc,unsub};
}

async function enableJsonBin(cfg){
  jb={key:cfg.jbKey,id:cfg.jbId};
  setSync("off","连接中…");
  try{
    if(!jb.id){
      const r=await fetch("https://api.jsonbin.io/v3",{method:"POST",
        headers:{"Content-Type":"application/json","X-Master-Key":jb.key,"X-Bin-Name":"dongshu-schedule"},
        body:JSON.stringify({tasks:state.tasks})});
      if(!r.ok) throw new Error("create");
      const d=await r.json(); jb.id=d.metadata.id;
      const c=JSON.parse(localStorage.getItem(LS.cfg)||"{}"); c.jbId=jb.id; localStorage.setItem(LS.cfg,JSON.stringify(c));
      toast("已创建同步空间");
    }
    await pullJsonBin();
    clearInterval(jbTimer); jbTimer=setInterval(()=>{ if(!document.hidden) pullJsonBin(); },30000);
  }catch(e){ setSync("err","JSONBin 连接失败，检查 Key"); }
}
async function pullJsonBin(){
  try{
    const r=await fetch("https://api.jsonbin.io/v3/b/"+jb.id,{headers:{"X-Master-Key":jb.key}});
    if(r.ok){ const d=await r.json(); if(d.record&&Array.isArray(d.record.tasks)){
      state.tasks=mergeTasks(d.record.tasks); saveLocal(); render(); }
      setSync("ok","已同步 "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})); }
  }catch(e){ setSync("off","离线，已存本地"); }
}
async function saveJsonBin(){
  if(!jb||!jb.id) return;
  try{
    await fetch("https://api.jsonbin.io/v3/b/"+jb.id,{method:"PUT",
      headers:{"Content-Type":"application/json","X-Master-Key":jb.key},body:JSON.stringify({tasks:state.tasks})});
    setSync("ok","已同步");
  }catch(e){ setSync("off","离线，已存本地"); }
}
function mergeTasks(remote){
  const out=remote.slice();
  state.tasks.forEach(t=>{ if(!out.find(r=>r.id===t.id)) out.push(t); }); // 保留本地独有任务
  return out;
}

function saveCloud(){ if(fb) fb.setDoc(fb.ref,{tasks:state.tasks, updatedAt:Date.now()}); }
function saveTasks(){ if(fb) saveCloud(); else if(jb) saveJsonBin(); else saveLocal(); }

function setSync(cls,txt){ $("#syncDot").className="dot "+cls; $("#syncText").textContent=txt; }

/* ============ 任务完成状态 ============ */
function isDone(t,date){
  if(t.repeat&&t.repeat!=="none") return !!(t.doneByDate&&t.doneByDate[date]);
  return !!t.done;
}
function setDone(t,date,v){
  if(t.repeat&&t.repeat!=="none"){ t.doneByDate=t.doneByDate||{}; t.doneByDate[date]=v; }
  else { t.done=v; t.doneAt=v?Date.now():null; }
}
function visibleOn(t,date){ // 某天是否显示该任务
  if(!t.repeat||t.repeat==="none") return t.date===date;
  const wd=(new Date(date+"T00:00:00").getDay()+6)%7; // 0=周一
  if(t.repeat==="daily") return true;
  if(t.repeat==="weekdays") return wd<5;
  if(t.repeat==="weekly") return t.date===date; // 按起始日期的星期
  return false;
}

/* ============ 渲染 ============ */
function render(){
  $("#todayLabel").textContent = new Date().toLocaleDateString("zh-CN",
    {year:"numeric",month:"long",day:"numeric",weekday:"long"});
  renderStat(); renderWeek(); renderChips(); renderList(); renderBanner();
}
function renderStat(){
  const date = state.view==="today"? todayStr() : state.selDay;
  const items = state.tasks.filter(t=>visibleOn(t,date) && matchFilter(t));
  const done = items.filter(t=>isDone(t,date)).length;
  const total = items.length;
  const pct = total? Math.round(done/total*100):0;
  const r=21, c=2*Math.PI*r, off=c*(1-pct/100);
  $("#statBox").innerHTML = `
    <div class="box">
      <svg class="ring" viewBox="0 0 50 50">
        <circle cx="25" cy="25" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/>
        <circle cx="25" cy="25" r="${r}" fill="none" stroke="var(--gold)" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
          transform="rotate(-90 25 25)"/>
        <text x="25" y="29" text-anchor="middle" font-size="13" font-weight="800" fill="var(--text)">${pct}%</text>
      </svg>
      <div><div class="n">${done}/${total}</div><div class="l">${state.view==="today"?"今日完成":"当日完成"}</div></div>
    </div>
    <div class="box">
      <div style="font-size:22px">📌</div>
      <div><div class="n">${state.tasks.filter(t=>isDone(t,todayStr())).length}</div>
      <div class="l">累计已完成</div></div>
    </div>`;
}
function renderWeek(){
  if(state.view!=="week"){ $("#weekWrap").style.display="none"; return; }
  $("#weekWrap").style.display="block";
  const days=weekDays();
  $("#weekBar").innerHTML = days.map(d=>{
    const ds=todayStr(d); const isT=ds===todayStr();
    const cnt=state.tasks.filter(t=>visibleOn(t,ds)).length;
    return `<div class="day ${ds===state.selDay?"on":""} ${isT?"today":""}" data-day="${ds}">
      <div class="wd">周${WEEK[d.getDay()]}</div><div class="dm">${d.getDate()}</div>
      <div class="wd">${cnt?cnt+"项":""}</div></div>`;
  }).join("");
}
function renderChips(){
  const chip=(k,name)=>`<button class="chip ${state.filterCat===k?"on":""}" data-cat="${k}">${name}</button>`;
  $("#chips").innerHTML = chip("all","全部")+CATS.map(c=>chip(c.k,c.name)).join("");
}
function matchFilter(t){
  if(state.filterCat!=="all" && t.category!==state.filterCat) return false;
  if(state.search && !(`${t.title} ${t.note||""}`.toLowerCase().includes(state.search.toLowerCase()))) return false;
  return true;
}
const PRI={high:"pri-high",mid:"pri-mid",low:"pri-low"};
function renderList(){
  const date = state.view==="today"? todayStr() : state.selDay;
  let items = state.tasks.filter(t=>visibleOn(t,date) && matchFilter(t));
  items.sort((a,b)=>{
    const da=isDone(a,date)?1:0, db=isDone(b,date)?1:0; if(da!==db) return da-db; // 未完成在前
    const pa={high:0,mid:1,low:2}[a.priority||"mid"], pb={high:0,mid:1,low:2}[b.priority||"mid"];
    if(pa!==pb) return pa-pb;
    return (a.time||"99:99").localeCompare(b.time||"99:99");
  });
  const box=$("#list");
  if(!items.length){ box.innerHTML=`<div class="empty">${state.search||state.filterCat!=="all"?"没有匹配的任务 🔍":"这一天很轻松，加件事吧 ✨"}</div>`; return; }
  const now=new Date();
  box.innerHTML = items.map(t=>{
    const done=isDone(t,date);
    const c=catMap[t.category]||catMap.other;
    const due = t.time && !done;
    let late=false;
    if(due){ const [h,m]=t.time.split(":").map(Number); const dt=new Date(date+"T"+t.time);
      if(dt<now) late=true; }
    return `<div class="task ${done?"done":""} ${late?"late":""}" data-id="${t.id}">
      <div class="ck" data-act="ck">${done?"✓":""}</div>
      <div class="body">
        <div class="tt">${esc(t.title)}</div>
        <div class="meta">
          <span class="tag ${c.cls}">${c.name}</span>
          ${t.time?`<span class="pill">🕒 ${t.time}</span>`:""}
          <span class="pri ${PRI[t.priority||"mid"]}"></span>
          ${t.repeat&&t.repeat!=="none"?`<span class="pill">🔁 ${repName(t.repeat)}</span>`:""}
          ${late?`<span class="pill" style="color:var(--red)">已过期</span>`:""}
          ${t.note?`<span class="pill">📝</span>`:""}
        </div>
      </div>
      <div class="act">
        <button data-act="edit" title="编辑">✏️</button>
        <button data-act="del" title="删除">🗑️</button>
      </div>
    </div>`;
  }).join("");
}
function repName(r){return {daily:"每天",weekdays:"工作日",weekly:"每周"}[r]||"";}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function renderBanner(){
  const date=todayStr();
  const pend=state.tasks.filter(t=>visibleOn(t,date)&&!isDone(t,date));
  const dueSoon=pend.filter(t=>t.time).sort((a,b)=>a.time.localeCompare(b.time)).slice(0,1);
  const box=$("#bannerBox");
  if(!pend.length){ box.innerHTML=""; return; }
  const soon = dueSoon[0];
  const tip = soon? `下一个：${esc(soon.title)} @ ${soon.time}` : `今天还有 ${pend.length} 件事没做，加油 💪`;
  box.innerHTML=`<div class="banner"><span style="font-size:20px">🔔</span>
    <div><b>别忘事</b><br>${tip}</div></div>`;
}

/* ============ 提醒 ============ */
function checkReminders(){
  if(!("Notification" in window)) return;
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  const date=todayStr();
  state.tasks.filter(t=>visibleOn(t,date)&&!isDone(t,date)&&t.time).forEach(t=>{
    const [h,m]=t.time.split(":").map(Number); const tMin=h*60+m;
    const key=date+"#"+t.id;
    if(reminded[key]) return;
    if(tMin-nowMin<=state.lead && tMin-nowMin>=-5){
      reminded[key]=true; persistReminded();
      const body=`${t.time} · ${t.title}`;
      if(Notification.permission==="granted") new Notification("⏰ 东叔日程提醒",{body});
      toast("⏰ "+body);
    }
  });
}

function drawQR(cv,text){
  // 轻量 QR：用外部库不可靠，这里绘制一个"可扫的同步码卡片"占位（复制即可）
  const ctx=cv.getContext("2d"); cv.width=160; cv.height=160; ctx.fillStyle="#fff"; ctx.fillRect(0,0,160,160);
  ctx.fillStyle="#2b2620"; ctx.font="bold 13px sans-serif"; ctx.textAlign="center";
  ctx.fillText("同步码（复制）",80,30); ctx.font="bold 11px monospace";
  const parts=text.match(/.{1,16}/g)||[text]; parts.forEach((p,i)=>ctx.fillText(p,80,60+i*18));
  ctx.font="10px sans-serif"; ctx.fillText("各设备填同一码",80,150);
}

/* ============ 启动 ============ */
async function start(){
  // 主题
  if(state.theme==="dark") document.body.classList.add("dark");
  else if(state.theme==="light") document.body.classList.remove("dark");
  loadCaldav();
  loadReminded();
  const cfg=JSON.parse(localStorage.getItem(LS.cfg)||"null");
  if(cfg&&cfg.backend==="firebase"){
    setSync("off","连接云端中…");
    try{ state.tasks=loadLocal(); await enableCloud(cfg,cfg.code); }
    catch(e){ setSync("err","云端连接失败，改用本地"); state.tasks=loadLocal(); saveLocal(); }
  } else if(cfg&&cfg.backend==="jsonbin"){
    state.tasks=loadLocal();
    try{ await enableJsonBin(cfg); }catch(e){ setSync("err","JSONBin 失败，本地模式"); }
  } else {
    state.tasks=loadLocal(); setSync("off","本地模式（设置可开同步）");
  }
  bind(); render();
  if("Notification" in window && Notification.permission==="default") requestNotify();
  setInterval(checkReminders, 15000); checkReminders();
  // 注册 Service Worker（PWA 可安装 + 离线）
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }
}
/* ============ iCloud CalDAV 日历同步（经 Cloudflare Worker 代理，iCloud 中转）============ */
const ICLOUD="https://caldav.icloud.com";
function loadCaldav(){ try{ const c=JSON.parse(localStorage.getItem(LS.cv)||"null"); if(c) state.cv=Object.assign({autoSync:true},c); }catch{} }
function saveCaldav(){ localStorage.setItem(LS.cv, JSON.stringify(state.cv)); }
function cvUid(t){ return (t.evId||(t.id+"@dongshu.app")); }
function escICS(s){ let v=String(s==null?"":s);
  return v.replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;"); }
function taskToICS(t){
  const date=t.date||todayStr();
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Dongshu//Schedule//CN","CALSCALE:GREGORIAN"];
  L.push("BEGIN:VEVENT");
  L.push("UID:"+cvUid(t));
  L.push("DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z");
  const p=n=>String(n).padStart(2,"0");
  if(t.time){ L.push("DTSTART:"+date.replace(/-/g,"")+"T"+t.time.replace(":","")+"00");
    const end=new Date(date+"T"+t.time+":00"); end.setHours(end.getHours()+1);
    L.push("DTEND:"+end.getFullYear()+p(end.getMonth()+1)+p(end.getDate())+"T"+p(end.getHours())+p(end.getMinutes())+"00"); }
  else { L.push("DTSTART;VALUE=DATE:"+date.replace(/-/g,""));
    const d=new Date(date+"T00:00:00"); d.setDate(d.getDate()+1);
    L.push("DTEND;VALUE=DATE:"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())); }
  L.push("SUMMARY:"+escICS(t.title));
  if(t.note) L.push("DESCRIPTION:"+escICS(t.note));
  if(t.category&&catMap[t.category]) L.push("CATEGORIES:"+catMap[t.category].name);
  if(t.repeat&&t.repeat!=="none") L.push("RRULE:FREQ="+({daily:"DAILY",weekdays:"WEEKLY;BYDAY=MO,TU,WE,TH,FR",weekly:"WEEKLY"}[t.repeat]));
  L.push("END:VEVENT","END:VCALENDAR");
  return L.join("\r\n");
}
function cvBasic(){ const a=btoa(unescape(encodeURIComponent(state.cv.user+":"+state.cv.pass)));
  return "Basic "+a; }
async function icRequest(method, path, body, extra){
  const proxy=(state.cv.proxy||"").replace(/\/+$/,"");
  const target=ICLOUD+path;
  const headers=Object.assign({"Authorization":cvBasic(),"Content-Type":"text/calendar;charset=utf-8"}, extra||{});
  return fetch(proxy+"?u="+encodeURIComponent(target), {method, headers, body});
}
function normHref(h){ if(h&&h.indexOf("http")===0){ try{ return new URL(h).pathname }catch(e){ return h } } return h||""; }
function parseResp(xml){
  const doc=new DOMParser().parseFromString(xml,"text/xml");
  const out=[];
  doc.querySelectorAll("response").forEach(r=>{
    const href=normHref(r.querySelector("href") && r.querySelector("href").textContent);
    const name=r.querySelector("displayname") ? r.querySelector("displayname").textContent : "";
    if(href) out.push({href, name});
  });
  return out;
}
async function icFindCalendar(){
  let r=await icRequest("PROPFIND","/",'<propfind xmlns="DAV:"><prop><current-user-principal/></prop></propfind>',{"Depth":"0"});
  const principal=parseResp(await r.text()).map(x=>x.href).find(Boolean) || "/";
  r=await icRequest("PROPFIND",principal,'<propfind xmlns="DAV:"><prop><calendar-home-set/></prop></propfind>',{"Depth":"0"});
  let home=""; const d2=new DOMParser().parseFromString(await r.text(),"text/xml");
  const chs=d2.querySelector("calendar-home-set"); if(chs) home=normHref(chs.textContent.trim());
  if(!home) home=principal.replace(/\/+$/,"")+"/calendars/";
  r=await icRequest("PROPFIND",home,'<propfind xmlns="DAV:"><prop><displayname/><resourcetype/></prop></propfind>',{"Depth":"1"});
  const cals=parseResp(await r.text()).filter(c=>c.href && c.href.replace(/\/+$/,"")!==home.replace(/\/+$/,""));
  const cal=cals.find(c=>/东叔/.test(c.name)) || cals[0];
  return cal ? cal.href : null;
}
async function syncCaldav(task, action){
  if(!state.cv||!state.cv.autoSync||!state.cv.proxy||!state.cv.user) return;
  if(!task.date) return;
  try{
    let calHref=state.cv.calHref;
    if(!calHref) calHref=await icFindCalendar();
    if(!calHref){ state.cv.calHref=null; saveCaldav(); return; }
    state.cv.calHref=calHref; saveCaldav();
    const href=calHref.replace(/\/+$/,"")+"/"+cvUid(task)+".ics";
    if(action==="delete"){ await icRequest("DELETE",href); return; }
    await icRequest("PUT",href,taskToICS(task),{"Depth":"0"});
    task.evId=cvUid(task); saveTasks();
  }catch(e){ console.warn("iCloud 同步出错",e); }
}
async function testCv(){
  if(!state.cv.proxy||!state.cv.user){ toast("请先填代理地址和 Apple ID"); return; }
  try{
    const r=await icRequest("PROPFIND","/",'<propfind xmlns="DAV:"><prop><current-user-principal/></prop></propfind>',{"Depth":"0"});
    if(r.ok){ state.cv.ok=true; state.cv.calHref=null; saveCaldav(); renderCvStatus(); toast("✅ iCloud 连接成功"); }
    else { state.cv.ok=false; saveCaldav(); renderCvStatus(); toast("连接失败，检查 Apple ID / App 专用密码 / 代理"); }
  }catch(e){ state.cv.ok=false; saveCaldav(); renderCvStatus(); toast("连接失败：确认代理地址可公网访问"); }
}
function renderCvStatus(){
  const s=$("#cvStatus"); if(!s) return;
  if(state.cv&&state.cv.ok){ s.textContent="✅ 已连接 iCloud"; s.style.color="var(--green,#2e7d32)"; }
  else { s.textContent=state.cv&&state.cv.proxy?"未连通":"未配置"; s.style.color=""; }
}

start();
</script>
